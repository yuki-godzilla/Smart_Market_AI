app:
  timezone: Asia/Tokyo
  log_json: true

llm_interpretation:
  ranking:
    enabled: true
    base_url: http://127.0.0.1:8088
    context_answer_path: /api/v1/context-answer
    timeout_seconds: 45.0
    model: null
    execution_mode: auto
    environment_profile: desktop
    preferred_profile: desktop_fast
    prompt_version: ranking_interpretation_mvp.v1
    schema_version: ranking_interpretation.v1
    cache_enabled: true
    cache_ttl_seconds: 21600
    max_candidates: 5
    max_sector_groups: 4
    max_context_text_chars: 240

risk:
  thresholds:
    max_notional_per_symbol: 3000000
    max_notional_per_basket: 10000000
    max_concentration: 0.25
    min_adv: 50000000
    min_dividend_yield: 0.03
    max_volatility: 0.6

portfolio:
  solver:
    backend: none
    tolerance: 0.000001
